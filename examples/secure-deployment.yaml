---
# Пример безопасного развертывания приложения МТС
# Этот deployment пройдет все проверки безопасности

apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-mts-app
  namespace: production
  labels:
    app: secure-mts-app
    team: backend
    environment: production
  annotations:
    # Аннотации для системы безопасности
    container-security/scanned: "true"
    container-security/signed: "true"
    container-security/compliance: "pci-dss,gdpr"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secure-mts-app
  template:
    metadata:
      labels:
        app: secure-mts-app
        team: backend
        environment: production
        security-policy: "mts-production"
    spec:
      containers:
      - name: app
        # Образ должен быть подписан и просканирован
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
          name: http
        # Resource limits для предотвращения DoS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # Environment variables
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: TEAM
          value: "backend"
        # Volume mounts (read-only)
        # volumeMounts:
        # - name: config
        #   mountPath: /app/config
        #   readOnly: true
      # Sidecar контейнер для логирования (опционально)
      # - name: logging-sidecar
