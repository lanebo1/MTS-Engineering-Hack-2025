apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-scanner
  namespace: container-security
  labels:
    app: trivy-scanner
    component: scanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trivy-scanner
  template:
    metadata:
      labels:
        app: trivy-scanner
        component: scanner
    spec:
      serviceAccountName: trivy-scanner-sa
      containers:
      - name: trivy-scanner
        image: repozitorij-dlya-raboty-7316-trivy-scanner:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: TRIVY_CACHE_DIR
          value: "/opt/trivy/cache"
        - name: TRIVY_REPORTS_DIR
          value: "/opt/trivy/reports"
        - name: TRIVY_TIMEOUT
          value: "5m"
        - name: TRIVY_SKIP_DB_UPDATE
          value: "true"
        - name: TRIVY_UPDATE_INTERVAL
          value: "24h"
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Volume mounts
        volumeMounts:
        - name: trivy-cache
          mountPath: /opt/trivy/cache
        - name: trivy-reports
          mountPath: /opt/trivy/reports
      volumes:
      - name: trivy-cache
        persistentVolumeClaim:
          claimName: trivy-cache-pvc
      - name: trivy-reports
        persistentVolumeClaim:
          claimName: trivy-reports-pvc
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: trivy-scanner
  namespace: container-security
  labels:
    app: trivy-scanner
    component: scanner
spec:
  selector:
    app: trivy-scanner
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-cache-pvc
  namespace: container-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-reports-pvc
  namespace: container-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-scanner-sa
  namespace: container-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trivy-scanner-role
  namespace: container-security
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trivy-scanner-rb
  namespace: container-security
subjects:
- kind: ServiceAccount
  name: trivy-scanner-sa
  namespace: container-security
roleRef:
  kind: Role
  name: trivy-scanner-role
  apiGroup: rbac.authorization.k8s.io
