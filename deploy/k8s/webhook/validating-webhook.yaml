apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: container-security-webhook
  namespace: container-security
  labels:
    app: container-security-webhook
    component: admission-controller
    security: enabled
webhooks:
- name: container-security-validator.container-security-mts.svc
  clientConfig:
    service:
      name: container-security-webhook
      namespace: container-security
      path: "/admission"
      port: 443  # Use HTTPS port
    caBundle: ""
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "Namespaced"
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["apps"]
    apiVersions: ["v1"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    scope: "Namespaced"
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["batch"]
    apiVersions: ["v1"]
    resources: ["jobs", "cronjobs"]
    scope: "Namespaced"
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  timeoutSeconds: 30
  failurePolicy: Ignore  # Allow deployments if webhook fails (for demo purposes)
  matchPolicy: Equivalent
  namespaceSelector:
    matchExpressions:
    - key: container-security/enabled
      operator: In
      values:
      - "true"
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - container-security
      - kube-system
      - kube-public
      - kube-node-lease
      - default
  objectSelector: {}  # Empty selector means all objects
